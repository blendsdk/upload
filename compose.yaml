name: blendsdk-upload

services:
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-uploads-test}
    ports:
      - '${S3MOCK_PORT:-9090}:9090'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:9090/favicon.ico || exit 1']
      interval: 2s
      timeout: 2s
      retries: 15
